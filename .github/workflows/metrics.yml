name: Generate Metrics

# 生成本地可缓存的 GitHub 数据图，降低 README 对外部 Vercel 服务的依赖
# Generates a self-hosted metrics SVG to reduce external Vercel dependencies.
# 默认用内置 GITHUB_TOKEN 即可跑通；如配置了 METRICS_TOKEN（classic PAT）则自动优先使用。

on:
  # 每天北京时间 08:00 刷新一次 · refresh daily
  schedule:
    - cron: "0 0 * * *"
  # 推送到主分支时刷新 · also refresh on push to default branch
  push:
    branches:
      - main
  # 支持手动触发 · allow manual run
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate GitHub metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: VioletScar-Hui
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_twemoji: yes
          config_display: large
          config_padding: 6%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, markdown, text, yaml, json
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics.svg [skip ci]"
          filename: assets/metrics.svg
