<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" preserveAspectRatio="none">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- 顶部光晕 -->
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#F75C7E" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- 波浪渐变 -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F75C7E"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F75C7E"/>
    </linearGradient>

    <!-- 文字渐变 -->
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F75C7E"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- 柔光滤镜 -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- 顶部光晕 -->
  <ellipse cx="600" cy="0" rx="700" ry="160" fill="url(#glow)" filter="url(#blur)"/>

  <!-- 装饰性波浪底层 -->
  <path d="M0,160 C180,120 320,200 500,150 C680,100 820,190 1000,140 C1120,105 1180,150 1200,160 L1200,220 L0,220 Z" fill="url(#wave2)" opacity="0.12"/>

  <!-- 装饰性波浪顶层 -->
  <path d="M0,175 C200,145 360,205 540,165 C720,125 860,195 1040,155 C1150,130 1180,165 1200,175 L1200,220 L0,220 Z" fill="url(#wave1)" opacity="0.22"/>

  <!-- 主体文字 -->
  <text x="600" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="62" font-weight="700" fill="url(#text)" letter-spacing="1">VioletScar-Hui</text>

  <!-- 副标题 -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="20" font-weight="500" fill="#C9D1D9">🎯 AIPM × AI Tooling &amp; Agentic Systems</text>

  <!-- 底部细线 -->
  <line x1="420" y1="172" x2="780" y2="172" stroke="url(#wave1)" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
</svg>
